openapi: 3.1.0
info:
  title: Mo Platform API
  version: 1.0.0-draft
  description: |
    Mo 电机多物理场智能设计平台 — Q1 API 边界草案（OpenAPI 3.1）。

    **契约口径（前后端对齐）：**
    - Q1：鉴权占位、项目 CRUD、`.mems` 下载/上传/导入/导出、history undo/redo 占位。
    - Materials：list/get 薄桩；完整 CRUD 属 **Q2**。
    - Jobs：POST/GET 薄桩（`analytic` | `fem` | `optimize`），异步 Celery 轮询；主体属 **Q2/Q3**。

    **实现边界：**
    - Wasm 解析可在客户端或 `packages/solver-analytic` 运行；本 API 不强制托管解析内核。
    - FEM 不在本 API 表面暴露专用 FEM 路由，仅通过 Jobs 作业类型进入（Q3）。
    - **Gate0 无业务实现**；本文件仅为 Q1 开工契约，路由可先返回 501/空壳。

    配套：`docs/drafts/mems-schema-v1.md`（`memsSchemaVersion: "1.0.0-draft"`）。
    真理源：`docs/01-任务书-v2.md`、`docs/02-阶段任务拆解与门禁.md`（本草案不修改二者）。

servers:
  - url: /api/v1
    description: Q1 relative base（compose 本地可映射）

tags:
  - name: Health
  - name: Auth
    description: Q1 鉴权占位
  - name: Projects
    description: Q1 项目 CRUD
  - name: Mems
    description: Q1 `.mems` 包上下载 / 导入导出
  - name: History
    description: Q1-6 Undo/Redo 占位
  - name: Materials
    description: Q1 薄桩；完整 CRUD → Q2
  - name: Jobs
    description: 异步作业薄桩；主体 → Q2/Q3

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness / readiness probe
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login stub（Q1 占位）
      description: 返回占位 token；正式 IdP/密码策略 Q1 可后置。
      operationId: postAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login OK（stub）
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, tokenType]
                properties:
                  accessToken:
                    type: string
                  tokenType:
                    type: string
                    default: Bearer
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout stub（Q1 占位）
      operationId: postAuthLogout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out（stub）
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user stub（Q1 占位）
      operationId: getAuthMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [id, username]
                properties:
                  id:
                    type: string
                    format: uuid
                  username:
                    type: string
                  displayName:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /projects:
    get:
      tags: [Projects]
      summary: List projects
      operationId: listProjects
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
                  total:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Projects]
      summary: Create project
      operationId: createProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [Projects]
      summary: Get project
      operationId: getProject
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Projects]
      summary: Update project metadata
      operationId: updateProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Projects]
      summary: Delete project
      operationId: deleteProject
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/mems:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [Mems]
      summary: Download `.mems` package
      description: 返回 zip 容器（application/zip）。元数据见 MemsMeta。
      operationId: downloadMems
      security:
        - bearerAuth: []
      responses:
        "200":
          description: `.mems` zip bytes
          content:
            application/zip:
              schema:
                type: string
                format: binary
          headers:
            X-Mems-Schema-Version:
              schema:
                type: string
                example: "1.0.0-draft"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Mems]
      summary: Upload / replace `.mems` package
      description: 整包替换；服务端校验顶层布局与 memsSchemaVersion。
      operationId: uploadMems
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemsMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/mems/import:
    post:
      tags: [Mems]
      summary: Import `.mems` into project
      description: 与 PUT 类似，侧重从外部文件导入并回写元数据。
      operationId: importMems
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: `.mems` zip
      responses:
        "200":
          description: Imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemsMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/mems/export:
    get:
      tags: [Mems]
      summary: Export `.mems`（download alias）
      description: 与 GET /mems 语义等价的导出入口，便于前端「导出」按钮。
      operationId: exportMems
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: `.mems` zip bytes
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/history:
    get:
      tags: [History]
      summary: List history entries（Q1-6）
      operationId: listHistory
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: History tree / linear list stub
          content:
            application/json:
              schema:
                type: object
                required: [entries, cursor]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/HistoryEntry"
                  cursor:
                    type: integer
                    description: Current undo cursor index
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/history/undo:
    post:
      tags: [History]
      summary: Undo stub（Q1-6）
      operationId: postHistoryUndo
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Undo applied（or no-op at root）
          content:
            application/json:
              schema:
                type: object
                required: [cursor, entry]
                properties:
                  cursor:
                    type: integer
                  entry:
                    $ref: "#/components/schemas/HistoryEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/history/redo:
    post:
      tags: [History]
      summary: Redo stub（Q1-6）
      operationId: postHistoryRedo
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Redo applied（or no-op at tip）
          content:
            application/json:
              schema:
                type: object
                required: [cursor, entry]
                properties:
                  cursor:
                    type: integer
                  entry:
                    $ref: "#/components/schemas/HistoryEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /materials:
    get:
      tags: [Materials]
      summary: List materials（Q1 stub；CRUD → Q2）
      operationId: listMaterials
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Material stubs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Material"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /materials/{materialId}:
    get:
      tags: [Materials]
      summary: Get material（Q1 stub；CRUD → Q2）
      operationId: getMaterial
      security:
        - bearerAuth: []
      parameters:
        - name: materialId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /jobs:
    post:
      tags: [Jobs]
      summary: Enqueue job stub（Q2/Q3 mostly）
      description: |
        Celery 异步作业入口。`jobType=analytic` 可在 Q2 充实；`fem` / `optimize` 属 Q3/Q4。
        Gate0/Q1 可返回 501 或占位 Job 记录。
      operationId: createJob
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, jobType]
              properties:
                projectId:
                  type: string
                  format: uuid
                jobType:
                  $ref: "#/components/schemas/JobType"
                payload:
                  type: object
                  additionalProperties: true
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          description: Not implemented yet（Gate0 / early Q1）

  /jobs/{jobId}:
    get:
      tags: [Jobs]
      summary: Poll job status / result（Q2/Q3）
      operationId: getJob
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Q1 占位 Bearer token

  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          example: "1.0.0-draft"
        time:
          type: string
          format: date-time

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    Project:
      type: object
      required:
        - id
        - name
        - topology
        - machineType
        - memsSchemaVersion
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        topology:
          type: string
          enum: [RF, AF]
        machineType:
          type: string
          enum: [BLDC, PMSM, ACIM]
        memsSchemaVersion:
          type: string
          example: "1.0.0-draft"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectCreate:
      type: object
      required: [name, topology, machineType]
      properties:
        name:
          type: string
        topology:
          type: string
          enum: [RF, AF]
        machineType:
          type: string
          enum: [BLDC, PMSM, ACIM]
        units:
          type: object
          additionalProperties: true

    MemsMeta:
      type: object
      required: [projectId, memsSchemaVersion, sizeBytes, checksumSha256, updatedAt]
      properties:
        projectId:
          type: string
          format: uuid
        memsSchemaVersion:
          type: string
          example: "1.0.0-draft"
        sizeBytes:
          type: integer
          minimum: 0
        checksumSha256:
          type: string
        updatedAt:
          type: string
          format: date-time

    Material:
      type: object
      required: [id, name, category]
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
          description: e.g. steel | magnet | coil | acim_bar
        meta:
          type: object
          additionalProperties: true

    JobType:
      type: string
      enum: [analytic, fem, optimize]
      description: analytic≈Q2；fem≈Q3；optimize≈Q4

    Job:
      type: object
      required: [id, projectId, jobType, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        jobType:
          $ref: "#/components/schemas/JobType"
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        resultRef:
          type: string
          description: Optional pointer into `.mems` results/ or object store
        error:
          $ref: "#/components/schemas/Error"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    HistoryEntry:
      type: object
      required: [id, commandType, summary, createdAt]
      properties:
        id:
          type: string
        commandType:
          type: string
          description: e.g. geometry.update
        summary:
          type: string
        createdAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
