openapi: 3.1.0
info:
  title: Mo Platform API
  version: 1.0.0
  description: |
    Mo 电机多物理场智能设计平台 — Q1/Q2/Q3 API 边界草案（OpenAPI 3.1）。

    **契约口径（前后端对齐）：**
    - Q1：鉴权占位、项目 CRUD、`.mems` 下载/上传/导入/导出、history undo/redo 占位。
    - Materials（**Q2-1 架构锁定**）：list/get（category）+ POST/PUT/DELETE；种子只读；类型化 `curves`；
      `materialsSchemaVersion: "0.1.0-q2"`。详见 docs/drafts/Q2-材料与解析边界.md。
    - Analytic（**Q2-2 / Q2-6**）双轨：交互主路径 = 客户端 Wasm（Rust→wasm32，**径向**）；可选 sync
      `POST /solver/analytic/solve`；批处理 = Jobs `jobType=analytic`（Celery，不可用时可进程内降级）。
    - **轴向解析（Q3-1）**：同一 `solve.schema.json`（`topology: AF`，MVP=PMSM）；Python 金标
      `packages/solver-analytic/axial_planes/`；AF UI 可用 sync **或** Jobs analytic（**不**强制 Wasm AF 硬门禁）。
    - Jobs：POST/GET（`analytic` | `fem` | `optimize` | `drive`）；交互 UI **不得**阻塞于 Jobs 长轮询为唯一 UX。
    - FEM（**Q3 主路径**）：仅 `jobType=fem` 异步；payload 见 `FemJobPayload`；`resultRef` → `.mems`
      `solver/fem/jobs/{jobId}/manifest.json` + `results/fem/{jobId}/` 精简产物。详见
      docs/drafts/Q3-轴向与FEM边界.md。

    **实现边界：**
    - **不强制**服务端托管唯一解析内核；Python `packages/solver-analytic` = 金标/CI；径向 Wasm = 交互主路径。
    - 可选 sync solve 供 Bot/CI/FE 降级与 **AF** 在 Wasm AF 落地前使用。
    - FEM **禁止**嵌入 `apps/api` 进程；Elmer/GetDP/Gmsh 仅容器（`packages/solver-fem` = 模板/schema，非二进制）。
    - api `version` / `memsSchemaVersion` 钉为 **`1.0.0`**（Q5-5；曾用 `1.0.0-draft`；读侧过渡双接受 draft∪1.0.0，新写只出 1.0.0；见 `docs/drafts/Q5-5-契约1.0.0钉死.md`）。材料子版本见 Material.`materialsSchemaVersion`（本项不 bump）。
    - **Q5-1**：`GET /projects/{projectId}/mems/files/{path}` 工程包成员只读（边界见 `docs/drafts/Q5-1-mems-files边界.md`）；实现已交付（去掉 planned 标记）。

    配套：`docs/drafts/Q3-轴向与FEM边界.md`；`docs/drafts/Q2-材料与解析边界.md`；`docs/drafts/mems-schema-v1.md`；
    `docs/drafts/history-契约-q1-6.md`；`docs/drafts/Q5-1-mems-files边界.md`；`docs/drafts/Q5-5-契约1.0.0钉死.md`；
    `docs/drafts/Q6-UEM与几何rebuild契约.md`；
    `packages/solver-analytic/api/solve.schema.json`；`packages/solver-fem/api/*.schema.json`。
    真理源：`docs/01-任务书-v2.md`、`docs/02-阶段任务拆解与门禁.md`（本草案不修改二者）。

    **Q6：** `POST /geometry/rebuild` 同步几何重建（封装 `mo_geometry.rebuild_live_geometry`；非 Celery）；
    契约见 `docs/drafts/Q6-UEM与几何rebuild契约.md`（Motor 拍板 A1+B1+C2+D1 @ `be6ed88`）。

servers:
  - url: /api/v1
    description: Q1 relative base（compose 本地可映射）

tags:
  - name: Health
  - name: Auth
    description: Q1 鉴权占位
  - name: Projects
    description: Q1 项目 CRUD
  - name: Mems
    description: Q1 `.mems` 包上下载 / 导入导出
  - name: History
    description: Q1-6 Undo/Redo 占位；语义见 docs/drafts/history-契约-q1-6.md（客户端权威；本 API 可空桩）
  - name: Materials
    description: Q2-1 CRUD + 种子只读；typed curves；见 Q2-材料与解析边界.md
  - name: Solver
    description: 可选同步解析；径向交互主路径=Wasm；轴向 AF 可用本端直至 Wasm AF
  - name: Drive
    description: Q4-1…4 驱动单工况 sync 预览；Map 走 Jobs
  - name: Geometry
    description: |
      Q6 同步几何 rebuild（D1）；封装 packages/geometry `rebuild_live_geometry`；
      **非** Celery Job。见 docs/drafts/Q6-UEM与几何rebuild契约.md
  - name: Jobs
    description: analytic=Q2-6 可选批处理；fem=Q3 主路径（Celery FEM worker）；drive=Q4；optimize=Q4-9（异步 NSGA；Celery optimize / in-process）

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness / readiness probe
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login stub（Q1 占位）
      description: 返回占位 token；正式 IdP/密码策略 Q1 可后置。
      operationId: postAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login OK（stub）
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, tokenType]
                properties:
                  accessToken:
                    type: string
                  tokenType:
                    type: string
                    default: Bearer
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout stub（Q1 占位）
      operationId: postAuthLogout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out（stub）
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user stub（Q1 占位）
      operationId: getAuthMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [id, username]
                properties:
                  id:
                    type: string
                    format: uuid
                  username:
                    type: string
                  displayName:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /projects:
    get:
      tags: [Projects]
      summary: List projects
      operationId: listProjects
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
                  total:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Projects]
      summary: Create project
      operationId: createProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [Projects]
      summary: Get project
      operationId: getProject
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Projects]
      summary: Update project metadata
      operationId: updateProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Projects]
      summary: Delete project
      operationId: deleteProject
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/mems:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [Mems]
      summary: Download `.mems` package
      description: |
        返回 zip 容器（application/zip）。元数据见 MemsMeta。
        **整包 I/O**。精简 FEM/optimize 单文件读走 Jobs artifacts（L4/Q4+-3 已关）。
        工程包任意成员只读见 **Q5-1** `GET .../mems/files/{path}`（原 Q4+-3b；边界稿 `docs/drafts/Q5-1-mems-files边界.md`）。
      operationId: downloadMems
      security:
        - bearerAuth: []
      responses:
        "200":
          description: `.mems` zip bytes
          content:
            application/zip:
              schema:
                type: string
                format: binary
          headers:
            X-Mems-Schema-Version:
              schema:
                type: string
                example: "1.0.0"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Mems]
      summary: Upload / replace `.mems` package
      description: |
        整包替换；服务端校验顶层布局与 memsSchemaVersion。
        非单文件 PUT。member 级**公开**读走 Q5-1 mems/files；Jobs artifacts 仍可选用 zip-member 作内部解析回落。
      operationId: uploadMems
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemsMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/mems/import:
    post:
      tags: [Mems]
      summary: Import `.mems` into project
      description: 与 PUT 类似，侧重从外部文件导入并回写元数据。
      operationId: importMems
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: `.mems` zip
      responses:
        "200":
          description: Imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemsMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/mems/export:
    get:
      tags: [Mems]
      summary: Export `.mems`（download alias）
      description: 与 GET /mems 语义等价的导出入口，便于前端「导出」按钮。
      operationId: exportMems
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: `.mems` zip bytes
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"


  /projects/{projectId}/mems/files/{path}:
    get:
      tags: [Mems]
      summary: "Get one .mems zip member by relative path (Q5-1)"
      description: |
        **Q5-1**（原 Q4+-3b）：工程包任意成员只读 GET。
        `path` 为 zip 内相对路径（支持多段，如 `geometry/params.json`、`solver/fem/jobs/{id}/manifest.json`）。
        禁止 `..`、空段、绝对路径；规范化与 Jobs artifacts 同严。
        Auth 与整包 mems GET 同（Bearer）。
        **本阶段只读**；member PUT/DELETE 非目标（另开项）。
        与 Jobs artifacts：精简 FEM/optimize / `/field` 仍走 artifacts；公开几何/工程文件应走本路径。
        artifacts 可选 zip-member 回落保留为内部解析，**不**把本路径叙述成 `/field` 替代。
        边界：`docs/drafts/Q5-1-mems-files边界.md`。
      operationId: getMemsFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/projectId"
        - name: path
          in: path
          required: true
          schema:
            type: string
          description: |
            mems-relative zip member path (may contain slashes).
            Reject empty, absolute (leading `/`), or `..` traversal → 400.
          examples:
            geometryParams:
              value: geometry/params.json
            solverManifest:
              value: solver/fem/jobs/00000000-0000-0000-0000-000000000001/manifest.json
      responses:
        "200":
          description: |
            Raw member bytes. Content-Type by extension
            (json→application/json；未知→application/octet-stream).
            Optional Content-Disposition attachment.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
            model/gltf+json:
              schema:
                type: string
                format: binary
            model/gltf-binary:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="params.json"'
        "400":
          description: "Illegal path (empty / absolute / .. / empty segments)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Project has no package, or member not found in zip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{projectId}/history:
    get:
      tags: [History]
      summary: List history entries（Q1-6）
      operationId: listHistory
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Linear stack stub（entries + cursor；语义见 history-契约-q1-6.md）
          content:
            application/json:
              schema:
                type: object
                required: [entries, cursor]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/HistoryEntry"
                  cursor:
                    type: integer
                    description: |
                      Index of next redo entry；invariant 0<=cursor<=len(entries).
                      See docs/drafts/history-契约-q1-6.md.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/history/undo:
    post:
      tags: [History]
      summary: Undo stub（Q1-6）
      operationId: postHistoryUndo
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Shape stub only（Q1 不强制服务端改状态；FE local-first）
          content:
            application/json:
              schema:
                type: object
                required: [cursor, entry]
                properties:
                  cursor:
                    type: integer
                  entry:
                    $ref: "#/components/schemas/HistoryEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/history/redo:
    post:
      tags: [History]
      summary: Redo stub（Q1-6）
      operationId: postHistoryRedo
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Shape stub only（Q1 不强制服务端改状态；FE local-first）
          content:
            application/json:
              schema:
                type: object
                required: [cursor, entry]
                properties:
                  cursor:
                    type: integer
                  entry:
                    $ref: "#/components/schemas/HistoryEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /materials:
    get:
      tags: [Materials]
      summary: List materials（Q2-1；seed + custom）
      description: |
        返回内置种子与自定义材料（默认不含 soft-deleted）。
        可用 `category` 过滤。契约：docs/drafts/Q2-材料与解析边界.md。
      operationId: listMaterials
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MaterialCategory"
          description: Filter by material category
        - name: includeDeleted
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Material list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Material"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Materials]
      summary: Create custom material（Q2-1）
      description: |
        仅创建 custom（`builtin=false`）。须带类型化 `curves`（按 category），不得仅靠自由 meta。
        种子不可经此接口写成 builtin。
      operationId: createMaterial
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Id conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /materials/{materialId}:
    parameters:
      - name: materialId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Materials]
      summary: Get material by id（Q2-1）
      operationId: getMaterial
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Materials]
      summary: Replace custom material（Q2-1；prefer over PATCH）
      description: |
        全量替换 custom。对 builtin 种子返回 403。Q2 不要求 PATCH。
      operationId: putMaterial
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialUpdate"
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Builtin seed is read-only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Materials]
      summary: Soft-delete custom material（Q2-1）
      description: Soft-delete（`deletedAt`）。种子不可删（403）。
      operationId: deleteMaterial
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Soft-deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Builtin seed is read-only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"


  /geometry/rebuild:
    post:
      tags: [Geometry]
      summary: "Sync live geometry rebuild (Q6 / D1)"
      description: |
        **Q6 P0 权威路径（D1）**：同步重建几何，返回与 `mo_geometry.rebuild_live_geometry` 同形的
        `{params, meshDescriptor, geometrySummary[, pipelineEntry]}`。
        **非** Celery Job；目标秒级。apps/api 须调用几何包权威实现。
        **禁止**用 `public/mesh` fixture 冒充成功响应。
        单位：`params.units.length` 默认 mm（亦接受 m）；`angle` 默认 deg（亦接受 rad）；
        `geometrySummary` 为 SI 米 / snake_case（几何包既有导出）。
        P1+：浏览器本地重建为主（A1）；本 API 留作金标/降级；响应形不变。
        契约：`docs/drafts/Q6-UEM与几何rebuild契约.md`（Motor tip `be6ed88` A1+B1+C2+D1；开闸 `cc3b2d1`）。
      operationId: postGeometryRebuild
      x-status: planned-q6
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeometryRebuildRequest"
            examples:
              radialPmsm:
                summary: RF PMSM params (mm)
                value:
                  topology: RF
                  machineType: PMSM
                  params:
                    schemaVersion: "0.1.0-q1"
                    topology: RF
                    machineType: PMSM
                    units:
                      length: mm
                      angle: deg
                    rotorTopology: inner
                    stator:
                      innerDiameter: 51.0
                      outerDiameter: 80.0
                      stackLength: 25.0
                      slotCount: 18
                      slotShape: straight
                      toothWidth: 4.5
                      yokeHeight: 5.0
                      skewAngle: null
                    rotor:
                      innerDiameter: 15.0
                      outerDiameter: 50.0
                      magnetTopology: SPM
                      poleCount: 6
                    airgap: 0.5
                    axialActiveLength: 25.0
      responses:
        "200":
          description: |
            Live rebuild result (= rebuild_live_geometry shape).
            Write into UEM.meshDescriptor / geometrySummary; clear geometryDirty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeometryRebuildResponse"
        "400":
          description: Validation failed (invalid params / topology mismatch / poleCount etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          description: |
            Topology/machineType not supported for live rebuild yet, or route not implemented
            (`x-status: planned-q6`). Client may fall back to fixture with explicit UI label
            (must NOT claim 建模完成).

  /solver/analytic/solve:
    post:
      tags: [Solver]
      summary: Optional sync analytic solve（Q2 stub；非 MVP 阻塞）
      description: |
        轻量同步包装 `packages/solver-analytic`，供 Bot/CI 与 Wasm 未就绪时的 FE 降级。
        **交互主路径 = 客户端 Wasm**。请求/响应对齐
        `packages/solver-analytic/api/solve.schema.json`（SolveRequest/SolveResult）。
        未实现可 501。降级序：Wasm → 本端 → Jobs analytic。
        见 docs/drafts/Q2-材料与解析边界.md。
      operationId: postSolverAnalyticSolve
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticSolveRequest"
      responses:
        "200":
          description: SolveResult
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticSolveResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          description: Not implemented yet（optional Q2 stub）


  /drive/solve:
    post:
      tags: [Drive]
      summary: Sync single-case drive preview（非 efficiency_map）
      description: |
        单工况同步预览；`mode=efficiency_map` 须走 Jobs。结果含 lossesW/currentsA/waveforms。
        详见 docs/drafts/驱动Jobs契约.md。
      operationId: postDriveSolve
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriveJobPayload"
      responses:
        "200":
          description: Drive result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /jobs:
    post:
      tags: [Jobs]
      summary: Enqueue job（analytic 可选；fem=Q3 主路径；drive=Q4-1…4；optimize=Q4-9（异步 NSGA；Celery optimize / in-process））
      description: |
        Celery 异步作业入口（analytic：Redis 不可用时可进程内假异步，契约形状不变）。
        - `jobType=analytic`：**可选**批处理 / Benchmark / **轴向 AF**（Wasm AF 未就绪时）；
          径向交互主路径仍为 Wasm。成功后快照 → `.mems` `solver/analytic/`。
        - `jobType=fem`：**Q3 主路径**（非可选）。payload **必须**符合 `FemJobPayload`
         （topology、machineType、dim、solverKernel、meshProfile、operatingPoint、materials；
          可选 templateId、`equationMode`、`dryRun`）。**禁止**在 api 进程内跑 Elmer/GetDP。
          **Q5-2**（FEM tip `797ce67` / `Q5-2-真磁静力学后处理.md`）：
          `equationMode`=`heat_proxy`|`magnetostatic`；缺省 + dryRun=false → heat_proxy 兼容；
          `templateId=af_pmsm_3d_ms` 暗示 magnetostatic。**heat-proxy ≠ magnetostatic**。
          Worker：`MO_FEM_DRY_RUN!=0` → API stub（magnetostaticPathReady=false、力标量 null）；
          `MO_FEM_DRY_RUN=0` → `packages/solver-fem.run_job` 真路径，写回 FEM 标量原样
          （可含 magnetostaticPathReady=true、postprocess=maxwell、axialForceN、
          magneticEnergyJ、elmerExit；仍 `pending_calibration: true`）。
          不得用 heat-proxy 冒充轴向力；**禁止**宣称 FEM ≤3%（待 Q5-4）。
          成功后 `resultRef` → `solver/fem/jobs/{jobId}/manifest.json`（F1）；精简产物在
          `results/fem/{jobId}/`。见 Q3-调度与FEM边界.md、Q4plus-5。
        - `jobType=drive`：Q4-1…4（BLDC 方波 / PMSM FOC / ACIM V/f+FOC / Map）；见 DriveJobPayload。
        - `optimize`：Q4-9 异步；校验 OptimizeJobPayload；resultRef=`solver/optimize/jobs/{jobId}/manifest.json`；cancel 幂等。
        交互 FEM：**fire → poll/subscribe → 进度**；不得以阻塞长轮询为唯一 UX。
        **Q6/D1：** FE UEM 视口应 `POST /geometry/rebuild`（同步秒级）；重建 **不是** Job、
        不自动入队 FEM。FEM payload 可携带 rebuild 导出的 `geometrySummary`（额外键 ignore）；
        `/field` 仍为 artifacts。Motor `be6ed88`；架构 `6dafa91`。
      operationId: createJob
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCreate"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          description: Not implemented yet（fem worker 未接线时）

  /jobs/{jobId}:
    get:
      tags: [Jobs]
      summary: Poll job status / result（Q2/Q3）
      description: |
        返回 Job（含 status、resultRef、error）。FEM/optimize 成功时 resultRef 指向 manifest；
        精简产物经 **Jobs artifacts** list/get 拉取（L4/Q4+-3 canonical）；包内非精简件公开读走 Q5-1 mems/files。
      operationId: getJob
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /jobs/{jobId}/artifacts:
    get:
      tags: [Jobs]
      summary: List thinned FEM/optimize artifacts（L4 / Q4+-3；从 manifest）
      description: |
        **Jobs artifacts GET = L4 / Q4+-3 精简结果单文件读；工程包仍走整包 mems；
        工程包任意成员只读由 **Q5-1** `GET .../mems/files/{path}` 提供（原 Q4+-3b；非 `/field` 替代）。**
        本路由关闭 Q3-L4「无 mems 单文件 GET」对 `/field`（有 jobId 时）的缺口叙述：
        精简 FEM/optimize 产物的 **canonical 单文件通道** = list + get（非另开 mems member GET）。
        从 worker 盘 `MO_OPT_WORKDIR` / `MO_FEM_WORKDIR`（`mems_shadow/` 或与 `.mems`
        同布局）或 job.payload 内嵌 manifest 读取 `artifacts[]`。
        读的是 F1 精简件索引（manifest + scalars/slice/preview/pareto），**非全场 VTU**。
        Job 不存在 → 404 `not_found`；有 job 但无 manifest → 404 `manifest_not_found`。
        dry-run stub 的 `artifacts=[]` → 200 + 空列表。
        对象存储 / 签名 URL 仍为后置，本路由不实现。
        裁决：`docs/drafts/Q4+-3-mems单文件与artifacts收口.md`（tip `83d2e6e`）。
      operationId: listJobArtifacts
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Artifact list from manifest
          content:
            application/json:
              schema:
                type: object
                required: [jobId, artifacts]
                properties:
                  jobId:
                    type: string
                    format: uuid
                  resultRef:
                    type: string
                    nullable: true
                  artifacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/FemArtifact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            Job missing (`not_found`) or manifest unlocatable (`manifest_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /jobs/{jobId}/artifacts/{artifactPath}:
    get:
      tags: [Jobs]
      summary: Get one thinned artifact by mems-relative path（L4 / Q4+-3 canonical）
      description: |
        **L4 / Q4+-3 canonical 单文件读**（fem + optimize thinned products；有 jobId 时供 `/field`）。
        按 `.mems` 相对路径返回精简产物字节（如 `solver/fem/jobs/{id}/manifest.json`、
        `results/fem/{id}/slice.gltf`、`results/optimize/{id}/pareto.json`）。
        **解析序**（与 `artifacts_resolve.resolve_artifact_bytes` 对齐）：
          MO_OPT_WORKDIR / MO_FEM_WORKDIR:
            mems_shadow/{rel} → {rel}
          → payload 内嵌 manifest.json（仅 manifest 自身）
          → 可选：job.projectId 对应已存 `.mems` zip 内同相对路径 member（已实现）
        整包 I/O 仍为 `GET/PUT /projects/{id}/mems`；工程包任意成员公开读见
        **Q5-1** `GET /projects/{id}/mems/files/{path}`（原 Q4+-3b；实现以 Q5-1 tip 为准）。
        路径穿越（`..`）拒绝。Content-Type：json/gltf/glb/png/webp。
        **非**默认全场 VTU 通道。workdir 未挂载且无内嵌/zip 时通常 404。
      operationId: getJobArtifact
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: artifactPath
          in: path
          required: true
          schema:
            type: string
          description: mems-relative path (may contain slashes)
      responses:
        "200":
          description: Artifact bytes
          content:
            application/json:
              schema:
                type: object
            model/gltf+json:
              schema:
                type: string
            image/png:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Bad path / traversal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Job or artifact missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/jobs/{jobId}/cancel:
    post:
      tags: [Jobs]
      summary: Cancel job（幂等；queued/running → cancelled）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job after cancel (or already cancelled / terminal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Q1 占位 Bearer token

  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          example: "1.0.0"
        time:
          type: string
          format: date-time


    GeometryRebuildRequest:
      type: object
      description: |
        Q6 sync rebuild request. `params` mirrors mems `geometry/params.json`
        (camelCase; default length=mm). See docs/drafts/Q6-UEM与几何rebuild契约.md
      required: [topology, params]
      properties:
        topology:
          type: string
          enum: [RF, AF]
          description: Must match params.topology
        machineType:
          type: string
          description: Optional; e.g. PMSM, ACIM
          examples: [PMSM, ACIM]
        params:
          type: object
          description: |
            Full geometry params object (RF or AF fragment).
            units.length default mm; units.angle default deg.
            poleCount = pole count (positive even); pole-pairs derived.
          additionalProperties: true

    GeometryRebuildResponse:
      type: object
      description: |
        Same shape as mo_geometry.rebuild_live_geometry return value.
      required: [params, meshDescriptor, geometrySummary]
      properties:
        params:
          type: object
          description: Normalized mems geometry fragment
          additionalProperties: true
        meshDescriptor:
          type: object
          description: Viewport / Three MeshDescriptor
          additionalProperties: true
        geometrySummary:
          type: object
          description: SI meters + snake_case summary for analytic/FEM assembly
          additionalProperties: true
        pipelineEntry:
          type: object
          description: Optional; AF-PMSM pipeline entry when applicable
          additionalProperties: true

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    Project:
      type: object
      required:
        - id
        - name
        - topology
        - machineType
        - memsSchemaVersion
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        topology:
          type: string
          enum: [RF, AF]
        machineType:
          type: string
          enum: [BLDC, PMSM, ACIM]
        memsSchemaVersion:
          type: string
          example: "1.0.0"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectCreate:
      type: object
      required: [name, topology, machineType]
      properties:
        name:
          type: string
        topology:
          type: string
          enum: [RF, AF]
        machineType:
          type: string
          enum: [BLDC, PMSM, ACIM]
        units:
          type: object
          additionalProperties: true

    MemsMeta:
      type: object
      required: [projectId, memsSchemaVersion, sizeBytes, checksumSha256, updatedAt]
      properties:
        projectId:
          type: string
          format: uuid
        memsSchemaVersion:
          type: string
          example: "1.0.0"
        sizeBytes:
          type: integer
          minimum: 0
        checksumSha256:
          type: string
        updatedAt:
          type: string
          format: date-time

    MaterialCategory:
      type: string
      enum: [steel, magnet, coil, acim_bar]
      description: Q2-1 材料类别

    CurveTable2D:
      type: object
      description: 二维表曲线；单位见各类 Material props
      required: [xName, yName, points]
      properties:
        xName:
          type: string
        yName:
          type: string
        xUnit:
          type: string
        yUnit:
          type: string
        points:
          type: array
          minItems: 2
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
        note:
          type: string

    SteelProps:
      type: object
      description: 硅钢 B-H 与/或 B-P；单位 B=T，H=A/m，P=W/kg
      properties:
        bh:
          $ref: "#/components/schemas/CurveTable2D"
        bp:
          $ref: "#/components/schemas/CurveTable2D"
        lossCoefficients:
          type: object
          additionalProperties: true

    MagnetProps:
      type: object
      description: 永磁退磁曲线 + Br/Hc；单位 Br=T，Hc=A/m，温度=°C
      required: [br_t, hc_a_per_m]
      properties:
        br_t:
          type: number
        hc_a_per_m:
          type: number
        demag:
          type: array
          minItems: 1
          items:
            type: object
            required: [curve]
            properties:
              temperature_c:
                type: number
              curve:
                $ref: "#/components/schemas/CurveTable2D"
        alphaBr:
          type: number
        alphaHc:
          type: number

    CoilProps:
      type: object
      description: 线圈；resistivity=Ω·m；fillFactor 0–1
      required: [resistivity_ohm_m]
      properties:
        resistivity_ohm_m:
          type: number
          exclusiveMinimum: 0
        fillFactor:
          type: number
          minimum: 0
          maximum: 1
        skin:
          type: object
          additionalProperties: true

    AcimBarProps:
      type: object
      description: ACIM 导条电/热物性；几何在 geometry 包。conductivity=S/m
      required: [conductivity_s_per_m]
      properties:
        conductivity_s_per_m:
          type: number
          exclusiveMinimum: 0
        skin:
          type: object
          additionalProperties: true

    MaterialCurves:
      type: object
      description: 按 category 填充对应分支
      properties:
        steel:
          $ref: "#/components/schemas/SteelProps"
        magnet:
          $ref: "#/components/schemas/MagnetProps"
        coil:
          $ref: "#/components/schemas/CoilProps"
        acim_bar:
          $ref: "#/components/schemas/AcimBarProps"

    Material:
      type: object
      required:
        - id
        - name
        - category
        - builtin
        - materialsSchemaVersion
      properties:
        id:
          type: string
        name:
          type: string
        category:
          $ref: "#/components/schemas/MaterialCategory"
        builtin:
          type: boolean
          description: true=种子只读；false=custom
        materialsSchemaVersion:
          type: string
          const: "0.1.0-q2"
        curves:
          $ref: "#/components/schemas/MaterialCurves"
        meta:
          type: object
          additionalProperties: true
          description: 扩展袋；过渡期可含旧 seed 键，不得长期替代 curves
        deletedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MaterialCreate:
      type: object
      required: [name, category, curves]
      properties:
        id:
          type: string
          description: Optional explicit id
        name:
          type: string
        category:
          $ref: "#/components/schemas/MaterialCategory"
        curves:
          $ref: "#/components/schemas/MaterialCurves"
        meta:
          type: object
          additionalProperties: true
        materialsSchemaVersion:
          type: string
          const: "0.1.0-q2"
          default: "0.1.0-q2"

    MaterialUpdate:
      type: object
      description: PUT 全量替换（custom only）
      required: [name, category, curves]
      properties:
        name:
          type: string
        category:
          $ref: "#/components/schemas/MaterialCategory"
        curves:
          $ref: "#/components/schemas/MaterialCurves"
        meta:
          type: object
          additionalProperties: true
        materialsSchemaVersion:
          type: string
          const: "0.1.0-q2"

    AnalyticSolveRequest:
      type: object
      description: |
        镜像 packages/solver-analytic/api/solve.schema.json SolveRequest（snake_case）。
        不以本文件另起 FE DTO。
      required:
        - schema_version
        - topology
        - machine_type
        - geometry
        - materials
        - operating_point
      properties:
        schema_version:
          type: string
          examples: ["0.0.0-gate0", "0.1.0-q2"]
        topology:
          type: string
          enum: [RF, AF]
        machine_type:
          type: string
          enum: [BLDC, PMSM, ACIM]
        geometry:
          type: object
          additionalProperties: true
          description: GeometrySummary — 见 Q2-材料与解析边界.md 附录 A
        materials:
          type: object
          additionalProperties: true
        operating_point:
          type: object
          additionalProperties: true

    AnalyticSolveResult:
      type: object
      description: 镜像 solve.schema.json SolveResult
      required: [schema_version, meta, torque_nm, back_emf_v_peak, losses_w]
      properties:
        schema_version:
          type: string
        meta:
          type: object
          additionalProperties: true
        torque_nm:
          type: number
        back_emf_v_peak:
          type: number
        losses_w:
          type: object
          additionalProperties: true
        inductance_h:
          type: object
          additionalProperties: true

    JobType:
      type: string
      enum: [analytic, fem, optimize, drive]
      description: |
        analytic=可选批处理 / AF 解析（径向 UI 主路径仍为 Wasm）；
        fem=Q3 主路径（始终异步）；optimize=Q4-9 async NSGA (analytic MVP)；drive=Q4-1…4 驱动（Celery/in-process）

    JobCreate:
      type: object
      required: [projectId, jobType]
      properties:
        projectId:
          type: string
          format: uuid
        jobType:
          $ref: "#/components/schemas/JobType"
        payload:
          description: |
            jobType=analytic：自由对象或 SolveRequest 子集。
            jobType=fem：必须符合 FemJobPayload（实现可渐进强制校验）。
            jobType=drive：须符合 DriveJobPayload（mode + machineType）。
            jobType=optimize：必须符合 OptimizeJobPayload（variables/objectives/nsga/evaluatorProfile）。
          oneOf:
            - $ref: "#/components/schemas/FemJobPayload"
            - $ref: "#/components/schemas/DriveJobPayload"
            - $ref: "#/components/schemas/OptimizeJobPayload"
            - type: object
              additionalProperties: true

    FemJobPayload:
      type: object
      description: |
        Q3/Q5-2 FEM 作业载荷。真理源亦见 packages/solver-fem/api/fem-job-payload.schema.json、
        docs/drafts/Q3-调度与FEM边界.md、docs/drafts/Q4plus-5-磁静力学与轴向真值.md、
        docs/drafts/Q5-2-真磁静力学后处理.md（tip `797ce67`）。
        **heat-proxy ≠ magnetostatic**；未校准路径 `pending_calibration: true`；
        真路径成功可含 magnetostaticPathReady / postprocess / axialForceN /
        magneticEnergyJ / elmerExit；不得用 heat-proxy 假造轴向力；
        **禁止**宣称 FEM ≤3%（Q5-4）。
      required: [topology, machineType, dim, solverKernel, meshProfile, operatingPoint, materials]
      properties:
        projectId:
          type: string
          format: uuid
          description: Optional echo of top-level projectId
        topology:
          type: string
          enum: [RF, AF]
        machineType:
          type: string
          enum: [BLDC, PMSM, ACIM]
        dim:
          type: string
          enum: [2d, 3d]
        solverKernel:
          type: string
          enum: [elmer, getdp]
          description: Q3 建议 Elmer-first；GetDP 可 stub（开放分叉 F2）
        meshProfile:
          type: string
          minLength: 1
          description: e.g. rf_pmsm_2d_default | af_pmsm_3d_min
        operatingPoint:
          type: object
          additionalProperties: true
          description: Inline OP or ref object into .mems / project
        materials:
          description: Material refs（Q2 materials / .mems materials/）
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: object
                additionalProperties: true
        templateId:
          type: string
          description: |
            Optional id under packages/solver-fem/templates/.
            `af_pmsm_3d_ms` implies equationMode=magnetostatic when equationMode omitted.
        equationMode:
          type: string
          enum: [heat_proxy, magnetostatic]
          description: |
            Q5-2 方程模式。缺省 + dryRun=false → heat_proxy（Q3 E2E 兼容）；
            不得默认为 magnetostatic。`MO_FEM_DRY_RUN!=0` stub 须回显；
            magnetostatic stub：magnetostaticPathReady=false、力标量 null。
            `MO_FEM_DRY_RUN=0` + templateId=af_pmsm_3d_ms 真路径成功时可写回
            magnetostaticPathReady=true、postprocess=maxwell、axialForceN、
            magneticEnergyJ、elmerExit（仍 pending_calibration）。
            **heat-proxy ≠ magnetostatic**；禁止宣称 FEM ≤3%（待 Q5-4）。
        geometrySummary:
          type: object
          additionalProperties: true
          description: |
            Optional UEM export from POST /geometry/rebuild (Q6/D1).
            Workers may ignore today; extra keys allowed for forward assembly.
        dryRun:
          type: boolean
          description: |
            Optional dry-run flag echoed into manifest scalars。Worker 门控仍以
            MO_FEM_DRY_RUN 为准（!=0 → stub；=0 → packages/solver-fem.run_job）。


    OptimizeJobPayload:
      type: object
      description: |
        Q4-9 optimize 作业载荷。真理源亦见 packages/solver-opt/api/optimize-job-payload.schema.json
        与 docs/drafts/Q4-NSGA-II跨服务边界.md §4.3。
        入队后异步 NSGA（Celery optimize / in-process）；禁止在 api 请求线程内跑 NSGA。
        成功 resultRef → solver/optimize/jobs/{jobId}/manifest.json；精简件经 Jobs artifacts。
      required: [variables, objectives, nsga, evaluatorProfile]
      properties:
        projectId:
          type: string
          format: uuid
          description: Optional echo of top-level projectId
        memsRef:
          type: string
        baseSolveRequest:
          type: object
          additionalProperties: true
          description: Baseline SolveRequest for analytic adapter; worker may fill fixture default when omitted
        variables:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, bounds]
            additionalProperties: true
            properties:
              id:
                type: string
              path:
                type: string
              type:
                type: string
                enum: [continuous, integer, discrete]
              bounds:
                type: array
                minItems: 2
                maxItems: 2
                items:
                  type: number
              discreteSet:
                type: array
                items:
                  type: number
        objectives:
          type: array
          minItems: 2
          items:
            type: object
            required: [id, sense, metricId]
            additionalProperties: true
            properties:
              id:
                type: string
              sense:
                type: string
                enum: [minimize, maximize]
              metricId:
                type: string
        constraints:
          type: array
          items:
            type: object
            additionalProperties: true
        nsga:
          type: object
          required: [popSize, generations, seed]
          properties:
            popSize:
              type: integer
              minimum: 2
              maximum: 64
            generations:
              type: integer
              minimum: 1
              maximum: 100
            seed:
              type: integer
        evaluatorProfile:
          type: string
          enum: [analytic, analytic+drive, analytic+fem]

    DriveJobPayload:
      type: object
      description: |
        Q4 drive 作业载荷。单工况或 efficiency_map（Map 仅 Jobs，禁止 sync 扫全图）。
        详见 docs/drafts/驱动Jobs契约.md；结果含 lossesW/currentsA/operatingPoint；
        Mo-解析适配 magnetEddy→pmEddy、bar→rotorBar、speedRpm→rpm、tempC=磁体温度。
      required: [mode, machineType]
      properties:
        mode:
          type: string
          enum: [bldc_square, pmsm_foc, acim_vf, acim_foc, efficiency_map]
        machineType:
          type: string
          enum: [BLDC, PMSM, ACIM]
        operatingPoint:
          type: object
          additionalProperties: true
        pwm:
          type: object
          additionalProperties: true
        deadTime:
          type: object
          additionalProperties: true
        plant:
          type: object
          additionalProperties: true
        mapGrid:
          type: object
          additionalProperties: true
          description: efficiency_map 网格；默认 nx=ny=20
        mapMode:
          type: string
          enum: [bldc_square, pmsm_foc, acim_vf, acim_foc]
        nSamples:
          type: integer
        projectId:
          type: string
          format: uuid

    FemArtifact:
      type: object
      required: [path, role, format]
      properties:
        path:
          type: string
          description: Relative to .mems root
        role:
          type: string
          enum: [scalars, surface, slice, preview, other]
        format:
          type: string
          enum: [json, gltf, glb, png, webp, other]
        bytes:
          type: integer
          minimum: 0

    FemManifest:
      type: object
      description: |
        solver/fem/jobs/{jobId}/manifest.json — packages/solver-fem/api/fem-manifest.schema.json
      required: [jobId, status, solverKernel, topology, machineType, dim, scalars, artifacts]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        solverKernel:
          type: string
          enum: [elmer, getdp]
        topology:
          type: string
          enum: [RF, AF]
        machineType:
          type: string
          enum: [BLDC, PMSM, ACIM]
        dim:
          type: string
          enum: [2d, 3d]
        scalars:
          type: object
          additionalProperties: true
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/FemArtifact"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Job:
      type: object
      required: [id, projectId, jobType, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        jobType:
          $ref: "#/components/schemas/JobType"
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        resultRef:
          type: string
          description: |
            Pointer into worker workdir / `.mems` layout or future object store.
            analytic → solver/analytic/…
            fem（推荐）→ solver/fem/jobs/{jobId}/manifest.json
              （artifacts 列 results/fem/{jobId}/…）
            optimize → solver/optimize/jobs/{jobId}/manifest.json
              （artifacts 列 results/optimize/{jobId}/…；经 Jobs artifacts GET）
            drive → drive://jobs/{jobId}
        error:
          $ref: "#/components/schemas/Error"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
          description: |
            可选；drive 成功时含 input + result（lossesW/currentsA/waveforms/metrics）。

    HistoryEntry:
      type: object
      description: |
        Command-stack entry. Semantics (linear stack, cursor, mems history/stack.json,
        local-first Undo/Redo): docs/drafts/history-契约-q1-6.md.
        Q1 does not require server-side stack persistence beyond shape alignment.
      required: [id, commandType, summary, createdAt]
      properties:
        id:
          type: string
          description: UUID
        commandType:
          type: string
          description: |
            Q1 minimal set — geometry.params.set | project.meta.set | noop
            (see history-契约-q1-6.md).
          examples:
            - geometry.params.set
            - project.meta.set
            - noop
        summary:
          type: string
          description: One-line UI summary (zh/en)
        createdAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
          description: Forward params; must be replayable for real commands
        inverse:
          type: object
          additionalProperties: true
          description: Recommended in Q1 for undo; if absent FE may use snapshot strategy
