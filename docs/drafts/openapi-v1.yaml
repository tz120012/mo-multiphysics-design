openapi: 3.1.0
info:
  title: Mo Platform API
  version: 1.0.0-draft
  description: |
    Mo 电机多物理场智能设计平台 — Q1/Q2/Q3 API 边界草案（OpenAPI 3.1）。

    **契约口径（前后端对齐）：**
    - Q1：鉴权占位、项目 CRUD、`.mems` 下载/上传/导入/导出、history undo/redo 占位。
    - Materials（**Q2-1 架构锁定**）：list/get（category）+ POST/PUT/DELETE；种子只读；类型化 `curves`；
      `materialsSchemaVersion: "0.1.0-q2"`。详见 docs/drafts/Q2-材料与解析边界.md。
    - Analytic（**Q2-2 / Q2-6**）双轨：交互主路径 = 客户端 Wasm（Rust→wasm32，**径向**）；可选 sync
      `POST /solver/analytic/solve`；批处理 = Jobs `jobType=analytic`（Celery，不可用时可进程内降级）。
    - **轴向解析（Q3-1）**：同一 `solve.schema.json`（`topology: AF`，MVP=PMSM）；Python 金标
      `packages/solver-analytic/axial_planes/`；AF UI 可用 sync **或** Jobs analytic（**不**强制 Wasm AF 硬门禁）。
    - Jobs：POST/GET（`analytic` | `fem` | `optimize`）；交互 UI **不得**阻塞于 Jobs 长轮询为唯一 UX。
    - FEM（**Q3 主路径**）：仅 `jobType=fem` 异步；payload 见 `FemJobPayload`；`resultRef` → `.mems`
      `solver/fem/jobs/{jobId}/manifest.json` + `results/fem/{jobId}/` 精简产物。详见
      docs/drafts/Q3-轴向与FEM边界.md。

    **实现边界：**
    - **不强制**服务端托管唯一解析内核；Python `packages/solver-analytic` = 金标/CI；径向 Wasm = 交互主路径。
    - 可选 sync solve 供 Bot/CI/FE 降级与 **AF** 在 Wasm AF 落地前使用。
    - FEM **禁止**嵌入 `apps/api` 进程；Elmer/GetDP/Gmsh 仅容器（`packages/solver-fem` = 模板/schema，非二进制）。
    - api `version` 保持 `1.0.0-draft`；材料子版本见 Material.`materialsSchemaVersion`。

    配套：`docs/drafts/Q3-轴向与FEM边界.md`；`docs/drafts/Q2-材料与解析边界.md`；`docs/drafts/mems-schema-v1.md`；
    `docs/drafts/history-契约-q1-6.md`；`packages/solver-analytic/api/solve.schema.json`；
    `packages/solver-fem/api/*.schema.json`。
    真理源：`docs/01-任务书-v2.md`、`docs/02-阶段任务拆解与门禁.md`（本草案不修改二者）。

servers:
  - url: /api/v1
    description: Q1 relative base（compose 本地可映射）

tags:
  - name: Health
  - name: Auth
    description: Q1 鉴权占位
  - name: Projects
    description: Q1 项目 CRUD
  - name: Mems
    description: Q1 `.mems` 包上下载 / 导入导出
  - name: History
    description: Q1-6 Undo/Redo 占位；语义见 docs/drafts/history-契约-q1-6.md（客户端权威；本 API 可空桩）
  - name: Materials
    description: Q2-1 CRUD + 种子只读；typed curves；见 Q2-材料与解析边界.md
  - name: Solver
    description: 可选同步解析；径向交互主路径=Wasm；轴向 AF 可用本端直至 Wasm AF
  - name: Jobs
    description: analytic=Q2-6 可选批处理；fem=Q3 主路径（Celery FEM worker）；optimize→Q4

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness / readiness probe
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login stub（Q1 占位）
      description: 返回占位 token；正式 IdP/密码策略 Q1 可后置。
      operationId: postAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login OK（stub）
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, tokenType]
                properties:
                  accessToken:
                    type: string
                  tokenType:
                    type: string
                    default: Bearer
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout stub（Q1 占位）
      operationId: postAuthLogout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out（stub）
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user stub（Q1 占位）
      operationId: getAuthMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [id, username]
                properties:
                  id:
                    type: string
                    format: uuid
                  username:
                    type: string
                  displayName:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /projects:
    get:
      tags: [Projects]
      summary: List projects
      operationId: listProjects
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
                  total:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Projects]
      summary: Create project
      operationId: createProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [Projects]
      summary: Get project
      operationId: getProject
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Projects]
      summary: Update project metadata
      operationId: updateProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Projects]
      summary: Delete project
      operationId: deleteProject
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/mems:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [Mems]
      summary: Download `.mems` package
      description: 返回 zip 容器（application/zip）。元数据见 MemsMeta。
      operationId: downloadMems
      security:
        - bearerAuth: []
      responses:
        "200":
          description: `.mems` zip bytes
          content:
            application/zip:
              schema:
                type: string
                format: binary
          headers:
            X-Mems-Schema-Version:
              schema:
                type: string
                example: "1.0.0-draft"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Mems]
      summary: Upload / replace `.mems` package
      description: 整包替换；服务端校验顶层布局与 memsSchemaVersion。
      operationId: uploadMems
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemsMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/mems/import:
    post:
      tags: [Mems]
      summary: Import `.mems` into project
      description: 与 PUT 类似，侧重从外部文件导入并回写元数据。
      operationId: importMems
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: `.mems` zip
      responses:
        "200":
          description: Imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemsMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/mems/export:
    get:
      tags: [Mems]
      summary: Export `.mems`（download alias）
      description: 与 GET /mems 语义等价的导出入口，便于前端「导出」按钮。
      operationId: exportMems
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: `.mems` zip bytes
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/history:
    get:
      tags: [History]
      summary: List history entries（Q1-6）
      operationId: listHistory
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Linear stack stub（entries + cursor；语义见 history-契约-q1-6.md）
          content:
            application/json:
              schema:
                type: object
                required: [entries, cursor]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/HistoryEntry"
                  cursor:
                    type: integer
                    description: |
                      Index of next redo entry；invariant 0<=cursor<=len(entries).
                      See docs/drafts/history-契约-q1-6.md.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/history/undo:
    post:
      tags: [History]
      summary: Undo stub（Q1-6）
      operationId: postHistoryUndo
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Shape stub only（Q1 不强制服务端改状态；FE local-first）
          content:
            application/json:
              schema:
                type: object
                required: [cursor, entry]
                properties:
                  cursor:
                    type: integer
                  entry:
                    $ref: "#/components/schemas/HistoryEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/history/redo:
    post:
      tags: [History]
      summary: Redo stub（Q1-6）
      operationId: postHistoryRedo
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Shape stub only（Q1 不强制服务端改状态；FE local-first）
          content:
            application/json:
              schema:
                type: object
                required: [cursor, entry]
                properties:
                  cursor:
                    type: integer
                  entry:
                    $ref: "#/components/schemas/HistoryEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /materials:
    get:
      tags: [Materials]
      summary: List materials（Q2-1；seed + custom）
      description: |
        返回内置种子与自定义材料（默认不含 soft-deleted）。
        可用 `category` 过滤。契约：docs/drafts/Q2-材料与解析边界.md。
      operationId: listMaterials
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MaterialCategory"
          description: Filter by material category
        - name: includeDeleted
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Material list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Material"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Materials]
      summary: Create custom material（Q2-1）
      description: |
        仅创建 custom（`builtin=false`）。须带类型化 `curves`（按 category），不得仅靠自由 meta。
        种子不可经此接口写成 builtin。
      operationId: createMaterial
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Id conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /materials/{materialId}:
    parameters:
      - name: materialId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Materials]
      summary: Get material by id（Q2-1）
      operationId: getMaterial
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Materials]
      summary: Replace custom material（Q2-1；prefer over PATCH）
      description: |
        全量替换 custom。对 builtin 种子返回 403。Q2 不要求 PATCH。
      operationId: putMaterial
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialUpdate"
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Builtin seed is read-only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Materials]
      summary: Soft-delete custom material（Q2-1）
      description: Soft-delete（`deletedAt`）。种子不可删（403）。
      operationId: deleteMaterial
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Soft-deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Builtin seed is read-only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /solver/analytic/solve:
    post:
      tags: [Solver]
      summary: Optional sync analytic solve（Q2 stub；非 MVP 阻塞）
      description: |
        轻量同步包装 `packages/solver-analytic`，供 Bot/CI 与 Wasm 未就绪时的 FE 降级。
        **交互主路径 = 客户端 Wasm**。请求/响应对齐
        `packages/solver-analytic/api/solve.schema.json`（SolveRequest/SolveResult）。
        未实现可 501。降级序：Wasm → 本端 → Jobs analytic。
        见 docs/drafts/Q2-材料与解析边界.md。
      operationId: postSolverAnalyticSolve
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticSolveRequest"
      responses:
        "200":
          description: SolveResult
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticSolveResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          description: Not implemented yet（optional Q2 stub）

  /jobs:
    post:
      tags: [Jobs]
      summary: Enqueue job（analytic 可选；fem=Q3 主路径；optimize→Q4）
      description: |
        Celery 异步作业入口（analytic：Redis 不可用时可进程内假异步，契约形状不变）。
        - `jobType=analytic`：**可选**批处理 / Benchmark / **轴向 AF**（Wasm AF 未就绪时）；
          径向交互主路径仍为 Wasm。成功后快照 → `.mems` `solver/analytic/`。
        - `jobType=fem`：**Q3 主路径**（非可选）。payload **必须**符合 `FemJobPayload`
         （topology、machineType、dim、solverKernel、meshProfile、operatingPoint、materials；
          可选 templateId）。**禁止**在 api 进程内跑 Elmer/GetDP。
          成功后 `resultRef` → `solver/fem/jobs/{jobId}/manifest.json`；精简产物在
          `results/fem/{jobId}/`（JSON scalars + glTF/GLB + PNG）。见 Q3-轴向与FEM边界.md。
        - `optimize`：Q4 占位。
        交互 FEM：**fire → poll/subscribe → 进度**；不得以阻塞长轮询为唯一 UX。
      operationId: createJob
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCreate"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          description: Not implemented yet（fem worker 未接线时）

  /jobs/{jobId}:
    get:
      tags: [Jobs]
      summary: Poll job status / result（Q2/Q3）
      description: |
        返回 Job（含 status、resultRef、error）。FEM 成功时 resultRef 指向 manifest；
        浏览器再经 Mems GET 拉取 `results/fem/{jobId}/` 精简产物。
      operationId: getJob
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /jobs/{jobId}/artifacts:
    get:
      tags: [Jobs]
      summary: List job artifacts（optional stub；Q3 MVP 可用 resultRef + mems GET）
      description: |
        **Q3 MVP 可不实现**（501）。优先使用 Job.resultRef → manifest.artifacts[] +
        Mems 包内相对路径。本路由为后续对象存储 / 签名下载预留。
      operationId: listJobArtifacts
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Artifact list（future）
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                    format: uuid
                  artifacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/FemArtifact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          description: Not implemented（Q3 MVP 允许）

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Q1 占位 Bearer token

  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          example: "1.0.0-draft"
        time:
          type: string
          format: date-time

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    Project:
      type: object
      required:
        - id
        - name
        - topology
        - machineType
        - memsSchemaVersion
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        topology:
          type: string
          enum: [RF, AF]
        machineType:
          type: string
          enum: [BLDC, PMSM, ACIM]
        memsSchemaVersion:
          type: string
          example: "1.0.0-draft"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectCreate:
      type: object
      required: [name, topology, machineType]
      properties:
        name:
          type: string
        topology:
          type: string
          enum: [RF, AF]
        machineType:
          type: string
          enum: [BLDC, PMSM, ACIM]
        units:
          type: object
          additionalProperties: true

    MemsMeta:
      type: object
      required: [projectId, memsSchemaVersion, sizeBytes, checksumSha256, updatedAt]
      properties:
        projectId:
          type: string
          format: uuid
        memsSchemaVersion:
          type: string
          example: "1.0.0-draft"
        sizeBytes:
          type: integer
          minimum: 0
        checksumSha256:
          type: string
        updatedAt:
          type: string
          format: date-time

    MaterialCategory:
      type: string
      enum: [steel, magnet, coil, acim_bar]
      description: Q2-1 材料类别

    CurveTable2D:
      type: object
      description: 二维表曲线；单位见各类 Material props
      required: [xName, yName, points]
      properties:
        xName:
          type: string
        yName:
          type: string
        xUnit:
          type: string
        yUnit:
          type: string
        points:
          type: array
          minItems: 2
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
        note:
          type: string

    SteelProps:
      type: object
      description: 硅钢 B-H 与/或 B-P；单位 B=T，H=A/m，P=W/kg
      properties:
        bh:
          $ref: "#/components/schemas/CurveTable2D"
        bp:
          $ref: "#/components/schemas/CurveTable2D"
        lossCoefficients:
          type: object
          additionalProperties: true

    MagnetProps:
      type: object
      description: 永磁退磁曲线 + Br/Hc；单位 Br=T，Hc=A/m，温度=°C
      required: [br_t, hc_a_per_m]
      properties:
        br_t:
          type: number
        hc_a_per_m:
          type: number
        demag:
          type: array
          minItems: 1
          items:
            type: object
            required: [curve]
            properties:
              temperature_c:
                type: number
              curve:
                $ref: "#/components/schemas/CurveTable2D"
        alphaBr:
          type: number
        alphaHc:
          type: number

    CoilProps:
      type: object
      description: 线圈；resistivity=Ω·m；fillFactor 0–1
      required: [resistivity_ohm_m]
      properties:
        resistivity_ohm_m:
          type: number
          exclusiveMinimum: 0
        fillFactor:
          type: number
          minimum: 0
          maximum: 1
        skin:
          type: object
          additionalProperties: true

    AcimBarProps:
      type: object
      description: ACIM 导条电/热物性；几何在 geometry 包。conductivity=S/m
      required: [conductivity_s_per_m]
      properties:
        conductivity_s_per_m:
          type: number
          exclusiveMinimum: 0
        skin:
          type: object
          additionalProperties: true

    MaterialCurves:
      type: object
      description: 按 category 填充对应分支
      properties:
        steel:
          $ref: "#/components/schemas/SteelProps"
        magnet:
          $ref: "#/components/schemas/MagnetProps"
        coil:
          $ref: "#/components/schemas/CoilProps"
        acim_bar:
          $ref: "#/components/schemas/AcimBarProps"

    Material:
      type: object
      required:
        - id
        - name
        - category
        - builtin
        - materialsSchemaVersion
      properties:
        id:
          type: string
        name:
          type: string
        category:
          $ref: "#/components/schemas/MaterialCategory"
        builtin:
          type: boolean
          description: true=种子只读；false=custom
        materialsSchemaVersion:
          type: string
          const: "0.1.0-q2"
        curves:
          $ref: "#/components/schemas/MaterialCurves"
        meta:
          type: object
          additionalProperties: true
          description: 扩展袋；过渡期可含旧 seed 键，不得长期替代 curves
        deletedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MaterialCreate:
      type: object
      required: [name, category, curves]
      properties:
        id:
          type: string
          description: Optional explicit id
        name:
          type: string
        category:
          $ref: "#/components/schemas/MaterialCategory"
        curves:
          $ref: "#/components/schemas/MaterialCurves"
        meta:
          type: object
          additionalProperties: true
        materialsSchemaVersion:
          type: string
          const: "0.1.0-q2"
          default: "0.1.0-q2"

    MaterialUpdate:
      type: object
      description: PUT 全量替换（custom only）
      required: [name, category, curves]
      properties:
        name:
          type: string
        category:
          $ref: "#/components/schemas/MaterialCategory"
        curves:
          $ref: "#/components/schemas/MaterialCurves"
        meta:
          type: object
          additionalProperties: true
        materialsSchemaVersion:
          type: string
          const: "0.1.0-q2"

    AnalyticSolveRequest:
      type: object
      description: |
        镜像 packages/solver-analytic/api/solve.schema.json SolveRequest（snake_case）。
        不以本文件另起 FE DTO。
      required:
        - schema_version
        - topology
        - machine_type
        - geometry
        - materials
        - operating_point
      properties:
        schema_version:
          type: string
          examples: ["0.0.0-gate0", "0.1.0-q2"]
        topology:
          type: string
          enum: [RF, AF]
        machine_type:
          type: string
          enum: [BLDC, PMSM, ACIM]
        geometry:
          type: object
          additionalProperties: true
          description: GeometrySummary — 见 Q2-材料与解析边界.md 附录 A
        materials:
          type: object
          additionalProperties: true
        operating_point:
          type: object
          additionalProperties: true

    AnalyticSolveResult:
      type: object
      description: 镜像 solve.schema.json SolveResult
      required: [schema_version, meta, torque_nm, back_emf_v_peak, losses_w]
      properties:
        schema_version:
          type: string
        meta:
          type: object
          additionalProperties: true
        torque_nm:
          type: number
        back_emf_v_peak:
          type: number
        losses_w:
          type: object
          additionalProperties: true
        inductance_h:
          type: object
          additionalProperties: true

    JobType:
      type: string
      enum: [analytic, fem, optimize]
      description: |
        analytic=可选批处理 / AF 解析（径向 UI 主路径仍为 Wasm）；
        fem=Q3 主路径（始终异步）；optimize≈Q4

    JobCreate:
      type: object
      required: [projectId, jobType]
      properties:
        projectId:
          type: string
          format: uuid
        jobType:
          $ref: "#/components/schemas/JobType"
        payload:
          description: |
            jobType=analytic：自由对象或 SolveRequest 子集。
            jobType=fem：必须符合 FemJobPayload（实现可渐进强制校验）。
          oneOf:
            - $ref: "#/components/schemas/FemJobPayload"
            - type: object
              additionalProperties: true

    FemJobPayload:
      type: object
      description: |
        Q3 FEM 作业载荷。真理源亦见 packages/solver-fem/api/fem-job-payload.schema.json
        与 docs/drafts/Q3-轴向与FEM边界.md。
      required: [topology, machineType, dim, solverKernel, meshProfile, operatingPoint, materials]
      properties:
        projectId:
          type: string
          format: uuid
          description: Optional echo of top-level projectId
        topology:
          type: string
          enum: [RF, AF]
        machineType:
          type: string
          enum: [BLDC, PMSM, ACIM]
        dim:
          type: string
          enum: [2d, 3d]
        solverKernel:
          type: string
          enum: [elmer, getdp]
          description: Q3 建议 Elmer-first；GetDP 可 stub（开放分叉 F2）
        meshProfile:
          type: string
          minLength: 1
          description: e.g. rf_pmsm_2d_default | af_pmsm_3d_min
        operatingPoint:
          type: object
          additionalProperties: true
          description: Inline OP or ref object into .mems / project
        materials:
          description: Material refs（Q2 materials / .mems materials/）
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: object
                additionalProperties: true
        templateId:
          type: string
          description: Optional id under packages/solver-fem/templates/

    FemArtifact:
      type: object
      required: [path, role, format]
      properties:
        path:
          type: string
          description: Relative to .mems root
        role:
          type: string
          enum: [scalars, surface, slice, preview, other]
        format:
          type: string
          enum: [json, gltf, glb, png, webp, other]
        bytes:
          type: integer
          minimum: 0

    FemManifest:
      type: object
      description: |
        solver/fem/jobs/{jobId}/manifest.json — packages/solver-fem/api/fem-manifest.schema.json
      required: [jobId, status, solverKernel, topology, machineType, dim, scalars, artifacts]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        solverKernel:
          type: string
          enum: [elmer, getdp]
        topology:
          type: string
          enum: [RF, AF]
        machineType:
          type: string
          enum: [BLDC, PMSM, ACIM]
        dim:
          type: string
          enum: [2d, 3d]
        scalars:
          type: object
          additionalProperties: true
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/FemArtifact"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Job:
      type: object
      required: [id, projectId, jobType, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        jobType:
          $ref: "#/components/schemas/JobType"
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        resultRef:
          type: string
          description: |
            Pointer into `.mems` or future object store.
            analytic → solver/analytic/…
            fem（推荐）→ solver/fem/jobs/{jobId}/manifest.json
              （artifacts 列 results/fem/{jobId}/…）
        error:
          $ref: "#/components/schemas/Error"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    HistoryEntry:
      type: object
      description: |
        Command-stack entry. Semantics (linear stack, cursor, mems history/stack.json,
        local-first Undo/Redo): docs/drafts/history-契约-q1-6.md.
        Q1 does not require server-side stack persistence beyond shape alignment.
      required: [id, commandType, summary, createdAt]
      properties:
        id:
          type: string
          description: UUID
        commandType:
          type: string
          description: |
            Q1 minimal set — geometry.params.set | project.meta.set | noop
            (see history-契约-q1-6.md).
          examples:
            - geometry.params.set
            - project.meta.set
            - noop
        summary:
          type: string
          description: One-line UI summary (zh/en)
        createdAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
          description: Forward params; must be replayable for real commands
        inverse:
          type: object
          additionalProperties: true
          description: Recommended in Q1 for undo; if absent FE may use snapshot strategy
