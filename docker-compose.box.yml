# Box / iptables-stub smoke overlay — DO NOT use as default.
# Default path: `make up` (service DNS postgres/redis).
# Box path:     `make up-box` / `make up-fem-box`（或 scripts/up-box.sh / up-fem-box.sh）.
#
# Why: some Bot/box Docker setups lack real iptables; mo-net DNS/east-west fails.
# Postgres/Redis stay on mo-net with host publish 5433/6380; api/worker talk via host gateway.
#
# 防漂：一旦选用本 overlay，之后每次 recreate 都必须同时 -f docker-compose.yml -f 本文件。
# 禁止裸 `docker compose up` / `scripts/start-deps.sh`（会丢掉本文件 → :5174 超时、worker DNS 失败）。
# 覆盖服务：api、web、worker、worker-fem（缺任一都会漂）。自检：make assert-box。
#
# Mo-运维 owns compose; SOLVER_ANALYTIC_PATH kept so sync solve still finds the packaged solver.

services:
  api:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Use host publish ports (not in-compose DNS)
      DATABASE_URL: postgresql+psycopg://mo:mo@host.docker.internal:${POSTGRES_PORT:-5433}/mo
      REDIS_URL: redis://host.docker.internal:${REDIS_PORT:-6380}/0
      SOLVER_ANALYTIC_PATH: ${SOLVER_ANALYTIC_PATH:-/opt/mo/packages/solver-analytic}
      # Same shared workdir as base compose (artifacts GET / worker disk)
      MO_FEM_WORKDIR: ${MO_FEM_WORKDIR:-/var/mo/fem}
      MO_OPT_WORKDIR: ${MO_OPT_WORKDIR:-/var/mo/fem}
    volumes:
      - mo_femdata:/var/mo/fem

  web:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/web/nginx.box.conf:/etc/nginx/conf.d/default.conf:ro

  worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+psycopg://mo:mo@host.docker.internal:${POSTGRES_PORT:-5433}/mo
      REDIS_URL: redis://host.docker.internal:${REDIS_PORT:-6380}/0
      SOLVER_ANALYTIC_PATH: ${SOLVER_ANALYTIC_PATH:-/opt/mo/packages/solver-analytic}
      CELERY_ENABLED: "1"

  worker-fem:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+psycopg://mo:mo@host.docker.internal:${POSTGRES_PORT:-5433}/mo
      REDIS_URL: redis://host.docker.internal:${REDIS_PORT:-6380}/0
      CELERY_ENABLED: "1"
      MO_FEM_WORKDIR: ${MO_FEM_WORKDIR:-/var/mo/fem}
      SOLVER_FEM_PATH: ${SOLVER_FEM_PATH:-/opt/mo/packages/solver-fem}
      MO_FEM_DRY_RUN: ${MO_FEM_DRY_RUN:-1}

