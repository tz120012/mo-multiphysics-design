# Box / iptables-stub smoke overlay — DO NOT use as default.
# Default path: `make up` (service DNS postgres/redis).
# Box path:     `make up-box` (api/web → host.docker.internal published ports).
#
# Why: some Bot/box Docker setups lack real iptables; mo-net DNS/east-west fails.
# Postgres/Redis stay on mo-net with host publish 5433/6380; api talks via host gateway.
#
# Mo-运维 owns compose; SOLVER_ANALYTIC_PATH kept so sync solve still finds the packaged solver.

services:
  api:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Use host publish ports (not in-compose DNS)
      DATABASE_URL: postgresql+psycopg://mo:mo@host.docker.internal:${POSTGRES_PORT:-5433}/mo
      REDIS_URL: redis://host.docker.internal:${REDIS_PORT:-6380}/0
      SOLVER_ANALYTIC_PATH: ${SOLVER_ANALYTIC_PATH:-/opt/mo/packages/solver-analytic}

  web:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/web/nginx.box.conf:/etc/nginx/conf.d/default.conf:ro
