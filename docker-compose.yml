# Q1-8 / P09 — one-click: web + api + Postgres + Redis
# Host ports 5433/6380 avoid clashing with other projects.
# In-compose DNS (Mo-后端): postgres:5432 / redis:6379
#
# Mo-运维 owns compose; context=. + SOLVER_ANALYTIC_PATH required for sync solve
# (packages/solver-analytic must be copied into the api image).

services:
  postgres:
    image: postgres:16-alpine
    container_name: mo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mo}
      POSTGRES_DB: ${POSTGRES_DB:-mo}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - mo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mo} -d ${POSTGRES_DB:-mo}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - mo-net

  redis:
    image: redis:7-alpine
    container_name: mo-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - mo_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - mo-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mo-api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mo:mo@postgres:5432/mo}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SOLVER_ANALYTIC_PATH: ${SOLVER_ANALYTIC_PATH:-/opt/mo/packages/solver-analytic}
      # Set CELERY_ENABLED=1 when using `make up-worker` (profile worker)
      CELERY_ENABLED: ${CELERY_ENABLED:-0}
      # Shared with worker for artifacts GET (L4/F1); same defaults as worker
      MO_FEM_WORKDIR: ${MO_FEM_WORKDIR:-/var/mo/fem}
      MO_OPT_WORKDIR: ${MO_OPT_WORKDIR:-/var/mo/fem}
    volumes:
      # api reads worker-written thinned artifacts via shared vol
      - mo_femdata:/var/mo/fem
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 15s
    networks:
      - mo-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: mo-web
    ports:
      - "${WEB_HOST_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - mo-net


  # Optional Celery analytic worker (Q2-6). Profile: worker. Default `make up` stays 4 services.
  # FEM Celery is worker-fem (profile fem) — Elmer never runs in apps/api uvicorn.
  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mo-worker
    # Default queue (analytic/drive) + Q4-9 optimize (task_routes → queue optimize)
    command: ["celery", "-A", "app.celery_app", "worker", "-Q", "celery,optimize", "--loglevel=INFO"]
    # Inherit api image HEALTHCHECK (:8000) — disable; worker is not an HTTP server
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mo:mo@postgres:5432/mo}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SOLVER_ANALYTIC_PATH: ${SOLVER_ANALYTIC_PATH:-/opt/mo/packages/solver-analytic}
      SOLVER_OPT_PATH: ${SOLVER_OPT_PATH:-/opt/mo/packages/solver-opt}
      CELERY_ENABLED: "1"
      # FEM workdir shared with fem service (Q3-3; Mo-有限元 fills solver tasks)
      MO_FEM_WORKDIR: ${MO_FEM_WORKDIR:-/var/mo/fem}
      MO_OPT_WORKDIR: ${MO_OPT_WORKDIR:-/var/mo/fem}
    volumes:
      - mo_femdata:/var/mo/fem
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - mo-net

  # Q3-3 FEM toolchain (Elmer/GetDP/Gmsh). Profile: fem.
  # Arch tip 8d966d9: container only — never host install; never inside apps/api process.
  # Stub until Mo-有限元 ships real Elmer(+Gmsh) Dockerfile body; GetDP may stay stub.
  fem:
    profiles: ["fem"]
    build:
      context: .
      dockerfile: apps/fem/Dockerfile
    container_name: mo-fem
    environment:
      MO_FEM_WORKDIR: ${MO_FEM_WORKDIR:-/var/mo/fem}
    volumes:
      - mo_femdata:/var/mo/fem
    # Idle sidecar — Celery worker-fem uses shared volume / docker exec later.
    command: ["sleep", "infinity"]
    networks:
      - mo-net

  # Celery FEM worker (queue `fem`). Separate from analytic `worker` and from uvicorn.
  worker-fem:
    profiles: ["fem"]
    build:
      context: .
      dockerfile: apps/fem/Dockerfile.worker
    container_name: mo-worker-fem
    command:
      [
        "celery",
        "-A",
        "app.celery_app",
        "worker",
        "-Q",
        "fem",
        "-n",
        "fem@%h",
        "--loglevel=INFO",
      ]
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mo:mo@postgres:5432/mo}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_ENABLED: "1"
      MO_FEM_WORKDIR: ${MO_FEM_WORKDIR:-/var/mo/fem}
      SOLVER_FEM_PATH: ${SOLVER_FEM_PATH:-/opt/mo/packages/solver-fem}
      MO_FEM_DRY_RUN: ${MO_FEM_DRY_RUN:-1}
    volumes:
      - mo_femdata:/var/mo/fem
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      fem:
        condition: service_started
    networks:
      - mo-net

volumes:
  mo_pgdata:
  mo_redisdata:
  mo_femdata:

networks:
  mo-net:
    name: mo-net
