# Q1-8 / P09 — one-click: web + api + Postgres + Redis
# Host ports 5433/6380 avoid clashing with other projects.
# In-compose DNS (Mo-后端): postgres:5432 / redis:6379
#
# Mo-运维 owns compose; context=. + SOLVER_ANALYTIC_PATH required for sync solve
# (packages/solver-analytic must be copied into the api image).

services:
  postgres:
    image: postgres:16-alpine
    container_name: mo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mo}
      POSTGRES_DB: ${POSTGRES_DB:-mo}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - mo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mo} -d ${POSTGRES_DB:-mo}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - mo-net

  redis:
    image: redis:7-alpine
    container_name: mo-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - mo_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - mo-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mo-api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mo:mo@postgres:5432/mo}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SOLVER_ANALYTIC_PATH: ${SOLVER_ANALYTIC_PATH:-/opt/mo/packages/solver-analytic}
      # Set CELERY_ENABLED=1 when using `make up-worker` (profile worker)
      CELERY_ENABLED: ${CELERY_ENABLED:-0}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 15s
    networks:
      - mo-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: mo-web
    ports:
      - "${WEB_HOST_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - mo-net


  # Optional Celery worker (Q2-6 / Q3-3). Profile: worker. Default `make up` stays 4 services.
  # Same repo-root build context so solver-analytic is in the image.
  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mo-worker
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=INFO"]
    # Inherit api image HEALTHCHECK (:8000) — disable; worker is not an HTTP server
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mo:mo@postgres:5432/mo}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SOLVER_ANALYTIC_PATH: ${SOLVER_ANALYTIC_PATH:-/opt/mo/packages/solver-analytic}
      CELERY_ENABLED: "1"
      # FEM workdir shared with fem service (Q3-3; Mo-有限元 fills solver tasks)
      MO_FEM_WORKDIR: ${MO_FEM_WORKDIR:-/var/mo/fem}
    volumes:
      - mo_femdata:/var/mo/fem
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - mo-net

  # Elmer/GetDP/Gmsh container (Q3-3). Profile: fem. Image owned with Mo-有限元.
  # Stub image until FEM ships real Dockerfile body; do not install FEM on host.
  fem:
    profiles: ["fem"]
    build:
      context: .
      dockerfile: apps/fem/Dockerfile
    container_name: mo-fem
    environment:
      MO_FEM_WORKDIR: ${MO_FEM_WORKDIR:-/var/mo/fem}
    volumes:
      - mo_femdata:/var/mo/fem
    # Idle placeholder — worker/FEM tasks will exec or queue into this volume.
    command: ["sleep", "infinity"]
    networks:
      - mo-net

volumes:
  mo_pgdata:
  mo_redisdata:
  mo_femdata:

networks:
  mo-net:
    name: mo-net
