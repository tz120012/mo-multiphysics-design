server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Box overlay: host.docker.internal comes from compose extra_hosts (/etc/hosts),
  # NOT from Docker embedded DNS. Do NOT use `resolver 127.0.0.11` + variable
  # proxy_pass here — that lookup never sees /etc/hosts and hangs until timeout
  # (Q4+-2 / former :5174 遗留).
  # Literal proxy_pass resolves via getaddrinfo → /etc/hosts → host-gateway.
  # Expects API published on host at API_HOST_PORT (default 8000).

  location /api/ {
    proxy_pass http://host.docker.internal:8000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://host.docker.internal:8000/health;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
