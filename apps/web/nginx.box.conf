server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Host gateway DNS (docker desktop / Linux host-gateway)
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    # Hit host-published API (make up-box expects API_HOST_PORT=8000 by default)
    set $mo_api host.docker.internal:8000;
    proxy_pass http://$mo_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    set $mo_api host.docker.internal:8000;
    proxy_pass http://$mo_api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
