[package]
name = "solver-analytic-wasm"
version = "0.1.0"
edition = "2021"
description = "Mo analytic solver (Wasm RF+AF) — SolveRequest/Result JSON aligned with packages/solver-analytic"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
